blueprint:
  name: Dunstabzug – intelligente Koch-Erkennung
  description: >-
    Erkennt Kochen anhand eines gewichteten Signals aus Luftfeuchte und
    Temperatur. Der Dunstabzug wird eingeschaltet, sobald der konfigurierbare
    Koch-Score erreicht wird. Anwesenheit und Zeitfenster werden berücksichtigt.
    Nach dem Ende der Kochaktivität läuft der Dunstabzug noch für eine
    konfigurierbare Zeit nach.
  domain: automation
  source_url: https://github.com/sanftleben/dunstabzug-automatisierung/blob/main/blueprints/automation/sanftleben/dunstabzug_automatisierung.yaml
  input:
    humidity_rate_sensor:
      name: Luftfeuchtigkeit – Änderungsrate
      description: >-
        Derivative-Sensor der Küchen-Luftfeuchtigkeit, idealerweise in %/min.
        Positive Werte bedeuten steigende Luftfeuchtigkeit.
      selector:
        entity:
          filter:
            - domain: sensor

    humidity_rise_threshold:
      name: Luftfeuchtigkeit – deutlicher Anstieg
      description: Ab diesem Anstieg pro Minute gibt es 2 Punkte für die Koch-Erkennung.
      default: 0.15
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          unit_of_measurement: '%/min'
          mode: box

    humidity_sensor:
      name: Luftfeuchtigkeit – absolut
      description: Aktuelle relative Luftfeuchtigkeit der Küche.
      selector:
        entity:
          filter:
            - domain: sensor

    humidity_minimum:
      name: Luftfeuchtigkeit – erhöhter Wert
      description: Ab diesem absoluten Wert gibt es 1 zusätzlichen Punkt.
      default: 45
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: '%'
          mode: box

    temperature_rate_sensor:
      name: Temperatur – Änderungsrate
      description: >-
        Derivative-Sensor der Küchentemperatur, idealerweise in °C/min.
        Positive Werte bedeuten steigende Temperatur.
      selector:
        entity:
          filter:
            - domain: sensor

    temperature_rise_threshold:
      name: Temperatur – deutlicher Anstieg
      description: Ab diesem Anstieg pro Minute gibt es 1 Punkt für die Koch-Erkennung.
      default: 0.08
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          unit_of_measurement: '°C/min'
          mode: box

    temperature_sensor:
      name: Temperatur – absolut
      description: Aktuelle Temperatur der Küche.
      selector:
        entity:
          filter:
            - domain: sensor

    temperature_minimum:
      name: Temperatur – erhöhter Wert
      description: Ab diesem absoluten Wert gibt es 1 zusätzlichen Punkt.
      default: 24
      selector:
        number:
          min: -20
          max: 60
          step: 0.1
          unit_of_measurement: '°C'
          mode: box

    occupancy_sensor:
      name: Anwesenheitssensor Küche
      description: Automatisches Einschalten erfolgt nur bei erkannter Anwesenheit.
      selector:
        entity:
          filter:
            - domain: binary_sensor

    exhaust_fan:
      name: Dunstabzug
      description: Schalter oder Lüfter für den Dunstabzug.
      selector:
        entity:
          filter:
            - domain:
                - switch
                - fan

    required_score:
      name: Koch-Score zum Einschalten
      description: >-
        Wie viele Punkte mindestens erreicht werden müssen. Standard 3 bedeutet
        z. B. deutlicher Feuchteanstieg (2) plus erhöhter Feuchtewert (1), oder
        Feuchteanstieg (2) plus Temperaturanstieg (1).
      default: 3
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider

    start_time:
      name: Früheste Einschaltzeit
      default: '06:00:00'
      selector:
        time: {}

    end_time:
      name: Späteste Einschaltzeit
      default: '22:00:00'
      selector:
        time: {}

    off_delay:
      name: Nachlaufzeit
      description: >-
        Zeit, die nach Ende der Kochaktivität gewartet wird, bevor der
        Dunstabzug ausgeschaltet wird.
      default:
        minutes: 7
      selector:
        duration:
          enable_day: false
          enable_millisecond: false
          enable_second: true

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input humidity_rate_sensor
    id: humidity_rate
  - trigger: state
    entity_id: !input humidity_sensor
    id: humidity
  - trigger: state
    entity_id: !input temperature_rate_sensor
    id: temperature_rate
  - trigger: state
    entity_id: !input temperature_sensor
    id: temperature
  - trigger: state
    entity_id: !input occupancy_sensor
    id: occupancy
  - trigger: time
    at: !input end_time
    id: end_time

variables:
  humidity_rate: "{{ states(!input humidity_rate_sensor) | float(0) }}"
  humidity: "{{ states(!input humidity_sensor) | float(0) }}"
  temperature_rate: "{{ states(!input temperature_rate_sensor) | float(0) }}"
  temperature: "{{ states(!input temperature_sensor) | float(0) }}"
  score: >-
    {% set ns = namespace(value=0) %}
    {% if humidity_rate >= ( !input humidity_rise_threshold | float(0) ) %}
      {% set ns.value = ns.value + 2 %}
    {% endif %}
    {% if humidity >= ( !input humidity_minimum | float(0) ) %}
      {% set ns.value = ns.value + 1 %}
    {% endif %}
    {% if temperature_rate >= ( !input temperature_rise_threshold | float(0) ) %}
      {% set ns.value = ns.value + 1 %}
    {% endif %}
    {% if temperature >= ( !input temperature_minimum | float(0) ) %}
      {% set ns.value = ns.value + 1 %}
    {% endif %}
    {{ ns.value }}

conditions: []

actions:
  - choose:
      - alias: Dunstabzug einschalten
        conditions:
          - condition: time
            after: !input start_time
            before: !input end_time
          - condition: state
            entity_id: !input occupancy_sensor
            state: 'on'
          - condition: state
            entity_id: !input exhaust_fan
            state: 'off'
          - condition: template
            value_template: >-
              {{ score | int(0) >= ( !input required_score | int(0) ) }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input exhaust_fan

      - alias: Dunstabzug ausschalten
        conditions:
          - condition: state
            entity_id: !input exhaust_fan
            state: 'on'
          - condition: template
            value_template: >-
              {{ score | int(0) < ( !input required_score | int(0) ) }}
        sequence:
          - delay: !input off_delay
          - condition: state
            entity_id: !input exhaust_fan
            state: 'on'
          - condition: template
            value_template: >-
              {{ (states(!input humidity_rate_sensor) | float(0)) < ( !input humidity_rise_threshold | float(0) )
                 and (states(!input temperature_rate_sensor) | float(0)) < ( !input temperature_rise_threshold | float(0) ) }}
          - action: homeassistant.turn_off
            target:
              entity_id: !input exhaust_fan
