blueprint:
  name: Dunstabzug – intelligente Koch-Erkennung
  description: >-
    Erkennt Kochaktivität anhand der dynamischen Änderung von Luftfeuchtigkeit
    und Temperatur. Absolute Sensorwerte werden nicht als Kochsignal verwendet,
    da sie vom normalen Küchenklima abhängen. Ein gewichteter Score verhindert,
    dass einzelne kurze Messspitzen den Dunstabzug einschalten.
  domain: automation
  source_url: https://github.com/sanftleben/dunstabzug-automatisierung/blob/main/blueprints/automation/sanftleben/dunstabzug_automatisierung.yaml
  input:
    humidity_rate_sensor:
      name: Luftfeuchtigkeit – Änderungsrate
      description: >-
        Derivative-Sensor der Küchen-Luftfeuchtigkeit, idealerweise in %/min.
        Positive Werte bedeuten steigende Luftfeuchtigkeit. Für weniger
        Messrauschen den Derivative-Sensor mit einem geglätteten Quellsensor
        oder einem geeigneten Zeitfenster betreiben.
      selector:
        entity:
          filter:
            - domain: sensor

    humidity_rise_threshold:
      name: Luftfeuchtigkeit – Koch-Anstieg
      description: >-
        Ab diesem Anstieg pro Minute gibt es 2 Punkte. Der Standardwert ist
        für dein gemessenes Kochprofil bewusst etwas konservativ gewählt.
      default: 0.3
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          unit_of_measurement: '%/min'
          mode: box

    humidity_strong_rise_threshold:
      name: Luftfeuchtigkeit – starker Anstieg
      description: Ab diesem Anstieg pro Minute gibt es 1 zusätzlichen Punkt.
      default: 0.8
      selector:
        number:
          min: 0
          max: 20
          step: 0.01
          unit_of_measurement: '%/min'
          mode: box

    temperature_rate_sensor:
      name: Temperatur – Änderungsrate
      description: >-
        Derivative-Sensor der Küchentemperatur, idealerweise in °C/min.
        Positive Werte bedeuten steigende Temperatur.
      selector:
        entity:
          filter:
            - domain: sensor

    temperature_rise_threshold:
      name: Temperatur – Koch-Anstieg
      description: >-
        Ab diesem Anstieg pro Minute gibt es 1 Punkt. Der Standardwert ist
        für dein gemessenes Kochprofil gewählt.
      default: 0.2
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          unit_of_measurement: '°C/min'
          mode: box

    temperature_strong_rise_threshold:
      name: Temperatur – starker Anstieg
      description: Ab diesem Anstieg pro Minute gibt es 1 zusätzlichen Punkt.
      default: 1
      selector:
        number:
          min: 0
          max: 20
          step: 0.01
          unit_of_measurement: '°C/min'
          mode: box

    occupancy_sensor:
      name: Anwesenheitssensor Küche
      description: Automatisches Einschalten erfolgt nur bei erkannter Anwesenheit.
      selector:
        entity:
          filter:
            - domain: binary_sensor

    exhaust_fan:
      name: Dunstabzug
      description: Schalter oder Lüfter für den Dunstabzug.
      selector:
        entity:
          filter:
            - domain:
                - switch
                - fan

    required_score:
      name: Koch-Score zum Einschalten
      description: >-
        Mindestpunktzahl zum Einschalten. Standard 3: deutlicher
        Feuchteanstieg (2) plus Temperaturanstieg (1) reicht bereits aus.
      default: 3
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider

    start_time:
      name: Früheste Einschaltzeit
      default: '06:00:00'
      selector:
        time: {}

    end_time:
      name: Späteste Einschaltzeit
      default: '22:00:00'
      selector:
        time: {}

    off_delay:
      name: Nachlaufzeit
      description: >-
        Zeit, die nach Ende der erkannten Kochaktivität gewartet wird, bevor
        der Dunstabzug ausgeschaltet wird.
      default:
        minutes: 7
      selector:
        duration:
          enable_day: false
          enable_millisecond: false
          enable_second: true

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input humidity_rate_sensor
    id: humidity_rate
  - trigger: state
    entity_id: !input temperature_rate_sensor
    id: temperature_rate
  - trigger: state
    entity_id: !input occupancy_sensor
    id: occupancy
  - trigger: time
    at: !input end_time
    id: end_time

variables:
  humidity_rate_sensor: !input humidity_rate_sensor
  temperature_rate_sensor: !input temperature_rate_sensor
  humidity_rise_threshold: !input humidity_rise_threshold
  humidity_strong_rise_threshold: !input humidity_strong_rise_threshold
  temperature_rise_threshold: !input temperature_rise_threshold
  temperature_strong_rise_threshold: !input temperature_strong_rise_threshold
  required_score: !input required_score
  cooking_score: >-
    {% set humidity_rate = states(humidity_rate_sensor) | float(0) %}
    {% set temperature_rate = states(temperature_rate_sensor) | float(0) %}
    {% set score = 0 %}
    {% if humidity_rate >= (humidity_rise_threshold | float(0)) %}
      {% set score = score + 2 %}
    {% endif %}
    {% if humidity_rate >= (humidity_strong_rise_threshold | float(0)) %}
      {% set score = score + 1 %}
    {% endif %}
    {% if temperature_rate >= (temperature_rise_threshold | float(0)) %}
      {% set score = score + 1 %}
    {% endif %}
    {% if temperature_rate >= (temperature_strong_rise_threshold | float(0)) %}
      {% set score = score + 1 %}
    {% endif %}
    {{ score }}

conditions: []

actions:
  - choose:
      - alias: Dunstabzug einschalten
        conditions:
          - condition: time
            after: !input start_time
            before: !input end_time
          - condition: state
            entity_id: !input occupancy_sensor
            state: 'on'
          - condition: state
            entity_id: !input exhaust_fan
            state: 'off'
          - condition: template
            value_template: >-
              {{ cooking_score | int(0) >= (required_score | int(0)) }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input exhaust_fan

      - alias: Dunstabzug ausschalten
        conditions:
          - condition: state
            entity_id: !input exhaust_fan
            state: 'on'
          - condition: template
            value_template: >-
              {{ cooking_score | int(0) < (required_score | int(0)) }}
        sequence:
          - delay: !input off_delay
          - condition: state
            entity_id: !input exhaust_fan
            state: 'on'
          - condition: template
            value_template: >-
              {{ (states(humidity_rate_sensor) | float(0)) < (humidity_rise_threshold | float(0))
                 and (states(temperature_rate_sensor) | float(0)) < (temperature_rise_threshold | float(0)) }}
          - action: homeassistant.turn_off
            target:
              entity_id: !input exhaust_fan
