blueprint:
  name: Dunstabzug – intelligente Koch-Erkennung
  description: >-
    Erkennt Kochen anhand der Änderung von Luftfeuchtigkeit und Temperatur
    statt einer kaum nutzbaren Leistungsaufnahme. Der Dunstabzug wird nur
    bei erkannter Anwesenheit und innerhalb des Zeitfensters eingeschaltet.
    Separate Einschalt- und Ausschaltwerte bilden eine Hysterese.
  domain: automation
  source_url: https://github.com/sanftleben/dunstabzug-automatisierung/blob/main/blueprints/automation/sanftleben/dunstabzug_automatisierung.yaml
  input:
    humidity_rate_sensor:
      name: Luftfeuchtigkeit – Änderungsrate
      description: >-
        Derivative-Sensor der Küchen-Luftfeuchtigkeit, idealerweise in %/min.
        Positive Werte bedeuten steigende Luftfeuchtigkeit.
      selector:
        entity:
          filter:
            - domain: sensor

    humidity_rise_threshold:
      name: Luftfeuchtigkeit – Anstieg zum Einschalten
      description: Ab diesem Anstieg pro Minute wird Kochdampf erkannt.
      default: 0.15
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          unit_of_measurement: '%/min'
          mode: box

    humidity_sensor:
      name: Luftfeuchtigkeit – absolut
      description: Aktuelle relative Luftfeuchtigkeit der Küche.
      selector:
        entity:
          filter:
            - domain: sensor

    humidity_minimum:
      name: Luftfeuchtigkeit – Mindestwert
      description: Der absolute Feuchtewert muss mindestens diesen Wert erreichen, damit der Feuchteanstieg als Kochsignal zählt.
      default: 45
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: '%'
          mode: box

    temperature_rate_sensor:
      name: Temperatur – Änderungsrate
      description: >-
        Derivative-Sensor der Küchentemperatur, idealerweise in °C/min.
        Positive Werte bedeuten steigende Temperatur.
      selector:
        entity:
          filter:
            - domain: sensor

    temperature_rise_threshold:
      name: Temperatur – Anstieg zum Einschalten
      description: Ab diesem Temperaturanstieg pro Minute wird zusätzliche Wärme erkannt.
      default: 0.08
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          unit_of_measurement: '°C/min'
          mode: box

    temperature_sensor:
      name: Temperatur – absolut
      description: Aktuelle Temperatur der Küche.
      selector:
        entity:
          filter:
            - domain: sensor

    temperature_minimum:
      name: Temperatur – Mindestwert
      description: Der absolute Temperaturwert muss mindestens diesen Wert erreichen, damit der Temperaturanstieg als Kochsignal zählt.
      default: 24
      selector:
        number:
          min: -20
          max: 60
          step: 0.1
          unit_of_measurement: '°C'
          mode: box

    power_sensor:
      name: Optionaler Leistungssensor
      description: >-
        Optionales Zusatzsignal. Für einen Gasherd kann hier der minimale
        Zündimpuls bzw. die Leistungsaufnahme des Kochfelds verwendet werden.
      default: ''
      selector:
        entity:
          filter:
            - domain: sensor

    power_threshold:
      name: Leistung – Zusatzsignal
      description: >-
        Leistung, die als zusätzliches Kochsignal gilt. Das Signal ist für
        Gasherde optional und sollte nicht die Haupt-Erkennung sein.
      default: 1
      selector:
        number:
          min: 0
          max: 5000
          step: 0.1
          unit_of_measurement: W
          mode: box

    occupancy_sensor:
      name: Anwesenheitssensor Küche
      description: Automatisches Einschalten erfolgt nur bei erkannter Anwesenheit.
      selector:
        entity:
          filter:
            - domain: binary_sensor

    exhaust_fan:
      name: Dunstabzug
      description: Schalter oder Lüfter für den Dunstabzug.
      selector:
        entity:
          filter:
            - domain:
                - switch
                - fan

    start_time:
      name: Früheste Einschaltzeit
      default: '06:00:00'
      selector:
        time: {}

    end_time:
      name: Späteste Einschaltzeit
      default: '22:00:00'
      selector:
        time: {}

    off_delay:
      name: Ausschaltverzögerung
      description: Zeit, die kein Kochsignal mehr vorhanden sein muss, bevor der Dunstabzug ausgeht.
      default:
        minutes: 5
      selector:
        duration:
          enable_day: false
          enable_millisecond: false
          enable_second: true

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input humidity_rate_sensor
    id: humidity_rate
  - trigger: state
    entity_id: !input humidity_sensor
    id: humidity
  - trigger: state
    entity_id: !input temperature_rate_sensor
    id: temperature_rate
  - trigger: state
    entity_id: !input temperature_sensor
    id: temperature
  - trigger: state
    entity_id: !input occupancy_sensor
    id: occupancy
  - trigger: time
    at: !input end_time
    id: end_time

variables:
  humidity_rate_sensor: !input humidity_rate_sensor
  humidity_rate_threshold: !input humidity_rise_threshold
  humidity_sensor: !input humidity_sensor
  humidity_minimum: !input humidity_minimum
  temperature_rate_sensor: !input temperature_rate_sensor
  temperature_rate_threshold: !input temperature_rise_threshold
  temperature_sensor: !input temperature_sensor
  temperature_minimum: !input temperature_minimum
  power_sensor: !input power_sensor
  power_threshold: !input power_threshold

conditions: []

actions:
  - choose:
      - alias: Dunstabzug einschalten
        conditions:
          - condition: time
            after: !input start_time
            before: !input end_time
          - condition: state
            entity_id: !input occupancy_sensor
            state: 'on'
          - condition: state
            entity_id: !input exhaust_fan
            state: 'off'
          - condition: template
            value_template: >-
              {% set humidity_rising =
                states(humidity_rate_sensor) | float(0) >= (humidity_rate_threshold | float(0))
                and states(humidity_sensor) | float(0) >= (humidity_minimum | float(0)) %}
              {% set temperature_rising =
                states(temperature_rate_sensor) | float(0) >= (temperature_rate_threshold | float(0))
                and states(temperature_sensor) | float(0) >= (temperature_minimum | float(0)) %}
              {% set power_signal =
                power_sensor != ''
                and states(power_sensor) | float(0) >= (power_threshold | float(0)) %}
              {{ humidity_rising or temperature_rising or power_signal }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input exhaust_fan

      - alias: Dunstabzug ausschalten
        conditions:
          - condition: state
            entity_id: !input exhaust_fan
            state: 'on'
          - condition: template
            value_template: >-
              {% set humidity_active =
                states(humidity_rate_sensor) | float(0) > 0
                or states(humidity_sensor) | float(0) > (humidity_minimum | float(0)) %}
              {% set temperature_active =
                states(temperature_rate_sensor) | float(0) > 0
                or states(temperature_sensor) | float(0) > (temperature_minimum | float(0)) %}
              {{ not humidity_active and not temperature_active }}
        sequence:
          - delay: !input off_delay
          - condition: state
            entity_id: !input exhaust_fan
            state: 'on'
          - condition: template
            value_template: >-
              {{ states(humidity_rate_sensor) | float(0) <= 0
                 and states(temperature_rate_sensor) | float(0) <= 0 }}
          - action: homeassistant.turn_off
            target:
              entity_id: !input exhaust_fan
